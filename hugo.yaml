baseURL: "https://ParkJaeRim.github.io/"
languageCode: "ko-KR"
title: "ParkJaeRim Dev Blog"
theme: "PaperMod"
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

params:
  env: production
  title: "ParkJaeRim Dev Blog"
  description: "개발하면서 배운 것들을 기록합니다."
  author: "ParkJaeRim"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true

  profileMode:
    enabled: true
    title: "박재림"
    subtitle: "정산 도메인 기반 대용량 데이터 처리 백엔드 엔지니어<br><br>Kotlin · Spring Boot · Spring Batch · MySQL · AWS"
    buttons:
      - name: "이력서"
        url: /resume/
      - name: "GitHub"
        url: "https://github.com/ParkJaeRim"

  socialIcons:
    - name: github
      url: "https://github.com/ParkJaeRim"
    - name: linkedin
      url: "https://www.linkedin.com/in/jaerim-park-107808161/"
    - name: email
      url: "mailto:dbahck200@gmail.com"

menu:
  main:
    - identifier: til
      name: TIL
      url: /til/
      weight: 10
    - identifier: resume
      name: 이력서
      url: /resume/
      weight: 30

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
